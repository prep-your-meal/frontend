name: CI & Security Scans

# This workflow runs on every push to main AND on every pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # === JOB 1: FAST FEEDBACK LOOP ===
  code-security:
    name: Fast SAST, SCA & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for Gitleaks to scan the entire git history

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Secret Scanning
      - name: 🔐 Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 2. Software Composition Analysis (SCA)
      - name: 📦 npm audit (High Severity)
        run: npm audit --audit-level=high

      # 3. Static Application Security Testing (SAST)
      - name: 🛡️ Semgrep Scan
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep semgrep scan --config=auto --error --quiet

      # 4. Code Quality & Type Checking
      - name: 💅 Linting
        run: npm run lint

  # === JOB 2: DEEP SEMANTIC ANALYSIS ===
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF findings to the GitHub Security tab
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # Optional: Use the extended security query suite for maximum strictness
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:javascript-typescript'
