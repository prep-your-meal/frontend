name: CI & Security Scans

# This workflow runs on every push to main AND on every pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # === JOB 1: FAST FEEDBACK LOOP ===
  code-security:
    name: Fast SAST, SCA & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Required for Gitleaks to scan the entire git history

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Secret Scanning
      - name: 🔐 Gitleaks Scan
        uses: gitleaks/gitleaks-action@82875bfa6080fb053b3ebf2e15bcda6d69106fb6 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Software Composition Analysis (SCA)
      - name: 📦 npm audit (High Severity)
        run: npm audit --audit-level=high

      # 3. Static Application Security Testing (SAST)
      - name: 🛡️ Semgrep Scan
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep semgrep scan --config=auto --error --quiet

      # 4. Code Quality & Type Checking
      - name: 💅 Linting
        run: npm run lint

  # === JOB 2: DEEP SEMANTIC ANALYSIS ===
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF findings to the GitHub Security tab
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b611370bfb095f32eb4a141bb02264560731fa55 # v3.25.11
        with:
          languages: javascript-typescript
          # Optional: Use the extended security query suite for maximum strictness
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b611370bfb095f32eb4a141bb02264560731fa55 # v3.25.11
        with:
          category: '/language:javascript-typescript'
