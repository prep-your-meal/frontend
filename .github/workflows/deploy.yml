name: CI/CD Pipeline (Release & Deploy Routing)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANT: Allows the bot to push the CHANGELOG and tag back

    steps:
      # === PART 1: RELEASE & CHANGELOG GENERATION ===
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22' # Updated to match your local Docker setup

      - name: Set Git Identity for Release Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate SemVer, version.txt and CHANGELOG.md
        run: npx --yes commit-and-tag-version

      - name: Push new Release Commit and Tag
        run: git push --follow-tags origin main

      # === PART 2: BUILD THE VUE APP ===
      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App for Production
        run: npm run build
        env:
          # Injects the live Laravel API URL into the frontend build.
          # Make sure to add PROD_API_URL to your GitHub Repository Secrets!
          VITE_API_BASE_URL: ${{ secrets.API_URL }}

      # === PART 3: DEPLOY INFRASTRUCTURE FILES TO STRATO ===
      - name: Deploy static files via SCP to Webspace
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.WEBSPACE_HOST }}
          username: ${{ secrets.WEBSPACE_USER }}
          password: ${{ secrets.WEBSPACE_PASSWORD }}
          port: ${{ secrets.WEBSPACE_PORT || 22 }}

          # Only upload the compiled 'dist' folder
          source: 'dist/'

          # strip_components: 1 ensures the contents of /dist are placed
          # directly into the target folder, without creating a "dist" folder on Strato
          strip_components: 1

          target: ${{ secrets.WEBSPACE_TARGET_DIR }}/..
